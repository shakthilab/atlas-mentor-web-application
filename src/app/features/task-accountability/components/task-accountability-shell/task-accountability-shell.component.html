<div class="workspace-layout">
  <!-- Left Panel: Employee Tree (Only rendered for Admin Tree roles) -->
  <div class="tree-sidebar-panel" [class.tree-open]="isTreeVisible" *ngIf="isAdminTreeRole">
    <app-employee-tree></app-employee-tree>
  </div>

  <!-- Backdrop when tree sidebar is open on mobile/tablet -->
  <div class="tree-backdrop" *ngIf="isTreeVisible && isAdminTreeRole" (click)="toggleTree()"></div>

  <!-- Right Panel: Accountability Workspace -->
  <div class="workspace-main-panel">
    <!-- Header / Tab Bar (only visible to Admin Tree roles) -->
    <div class="workspace-header" *ngIf="isAdminTreeRole">
      <div class="workspace-header-top">
        <span class="workspace-header-title">{{ 'taskAccountability.shell.title' | translate }}</span>
        <button class="tree-toggle-mobile-btn" (click)="toggleTree()">
          <i-tabler name="users" class="icon-16"></i-tabler>
          <span>{{ 'taskAccountability.shell.employees' | translate }}</span>
        </button>
      </div>

      <nav class="workspace-nav" #workspaceNav>
        <a class="nav-tab" routerLink="daily" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{ 'taskAccountability.shell.dailyWorkspace' | translate }}</a>
        <a class="nav-tab" routerLink="pending-review" routerLinkActive="active" *ngIf="canReviewApprovals">{{ 'taskAccountability.shell.needsMyReview' | translate }}</a>
        <a class="nav-tab" routerLink="templates" routerLinkActive="active">{{ 'taskAccountability.shell.dailyTemplates' | translate }}</a>
        <!-- Weekly Templates and Weekly Accountability temporarily hidden -->
        <!-- <a class="nav-tab" routerLink="weekly-templates" routerLinkActive="active">Weekly Templates</a> -->
        <!-- <a class="nav-tab" routerLink="weekly" routerLinkActive="active">Weekly Accountability</a> -->
      </nav>
    </div>

    <!-- Workspace Sub-Page body -->
    <div class="workspace-body">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<app-task-create-drawer></app-task-create-drawer>
